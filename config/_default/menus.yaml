# Navigation Links
#   To link to a homepage block, set the URL to a hash `#` followed by that
#     block's `id` in `content/_index.md`.
#   The weight parameter defines the order that the links will appear in.

main:
  - name: Home
    url: '#about'
    weight: 10
  - name: Experience
    url: '#experience'
    weight: 20
  - name: Projects
    url: '#projects'
    weight: 30
  - name: Publications
    url: '#publications'
    weight: 40
  - name: Teaching
    url: '#teaching'
    weight: 50
  - name: Talks
    url: '#talks'
    weight: 60

  # Link to a PDF of your resume/CV from the menu.
  # To enable, copy your resume/CV to `static/uploads/resume.pdf` and uncomment the lines below.
  # - name: CV
  #   url: static/uploads/resume.pdf
  #   weight: 70
